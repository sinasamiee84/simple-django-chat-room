<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به چت</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: #111827;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #1f2937;
        }
        h2 { margin-bottom: 24px; font-size: 1.75rem; color: #38bdf8; font-weight: 700; }
        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background: #030712;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="card">
        <h2>شروع گفتگو</h2>
        <input id="username-input" type="text" placeholder="نام کاربری خود را وارد کنید...">
        <input id="room-name-input" type="text" placeholder="نام اتاق چت...">
        <button id="room-name-submit">ورود به اتاق</button>
    </div>

    <script>
        document.querySelector('#room-name-submit').onclick = function() {
            const username = document.querySelector('#username-input').value.trim();
            const roomName = document.querySelector('#room-name-input').value.trim();

            if(username === '' || roomName === '') {
                alert('لطفاً هر دو فیلد را پر کنید!');
                return;
            }

            sessionStorage.setItem('chat_username', username);
            window.location.pathname = '/' + roomName;
        };

        document.querySelector('#room-name-input').onkeyup = function(e) {
            if (e.key === 'Enter') document.querySelector('#room-name-submit').click();
        };
    </script>
</body>
</html>
