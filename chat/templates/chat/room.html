<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اتاق چت</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            background: #111827;
            width: 100%;
            max-width: 650px;
            height: 85vh;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #1f2937;
        }
        .chat-header {
            padding: 20px;
            background: #030712;
            border-bottom: 1px solid #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .room-info h2 { font-size: 1.2rem; color: #38bdf8; }
        .room-info span { font-size: 0.8rem; color: #9ca3af; }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #1f2937;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            transition: background 0.3s;
        }
        .status-dot.connected { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }

        #chat-log {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #111827;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .message-bubble.incoming {
            background: #1f2937;
            color: #f3f4f6;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message-bubble.outgoing {
            background: #0284c7;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .msg-user {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #38bdf8;
        }
        .message-bubble.outgoing .msg-user { color: #bae6fd; }

        .chat-footer {
            padding: 20px;
            background: #030712;
            border-top: 1px solid #1f2937;
            display: flex;
            gap: 12px;
        }
        #chat-message-input {
            flex: 1;
            padding: 14px 16px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        #chat-message-input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

        #chat-message-submit {
            padding: 0 24px;
            background: #0284c7;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        #chat-message-submit:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="room-info">
                <h2>اتاق: {{ room_name }}</h2>
                <span>کاربر: <strong id="current-username"></strong></span>
            </div>
            <div class="status-badge">
                <div id="status-dot" class="status-dot"></div>
                <span id="status-text">در حال اتصال...</span>
            </div>
        </div>

        <div id="chat-log"></div>

        <div class="chat-footer">
            <input id="chat-message-input" type="text" placeholder="پیام خود را بنویسید...">
            <button id="chat-message-submit">ارسال</button>
        </div>
    </div>

    <script>
        const roomName = "{{ room_name }}";
        const username = sessionStorage.getItem('chat_username') || 'مهمان';
        document.getElementById('current-username').innerText = username;

        const wsScheme = window.location.protocol === "https:" ? "wss://" : "ws://";
        const chatSocket = new WebSocket(
            wsScheme + window.location.host + '/ws/' + roomName + '/'
        );

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');

        chatSocket.onopen = function() {
            statusDot.classList.add('connected');
            statusText.innerText = 'متصل';
        };

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const chatLog = document.querySelector('#chat-log');

            const isMe = data.username === username;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble ' + (isMe ? 'outgoing' : 'incoming');

            bubble.innerHTML = `
                <div class="msg-user">${data.username}</div>
                <div>${data.message}</div>
            `;

            chatLog.appendChild(bubble);
            chatLog.scrollTop = chatLog.scrollHeight;
        };

        chatSocket.onclose = function() {
            statusDot.classList.remove('connected');
            statusText.innerText = 'قطع شده';
        };

        document.querySelector('#chat-message-submit').onclick = function() {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value.trim();

            if (message === '') return;

            chatSocket.send(JSON.stringify({
                'message': message,
                'username': username
            }));

            messageInputDom.value = '';
        };

        document.querySelector('#chat-message-input').onkeyup = function(e) {
            if (e.key === 'Enter') document.querySelector('#chat-message-submit').click();
        };
    </script>
</body>
</html>
